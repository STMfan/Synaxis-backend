[project]
name = "synaxis"
version = "1.0.0.post1"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
description = "A lightweight teaching LLM harness / 轻量教学 LLM 框架"
requires-python = ">=3.12.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23,<26",
  "python-multipart>=0.0.20,<1", "playwright>=1.50,<2", "pillow>=13,<14",
  "certifi>=2026.10.19",
  "fastembed==0.9.0", "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit==2.10.1"]
sandbox = ["numpy>=2,<3", "pillow>=13,<14", "svglib>=2,<3", "svg3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not integration and not syllabus_integration'"
markers = [
  "integration: real local Linux nsjail, Chromium, HTTPS and managed-process acceptance",
  "syllabus_integration: supplied 2017 corpus and actual local ONNX model, no external API",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.uv]
package = false
# FastEmbed 0.9.0 caps Pillow below its security fixes. Text embeddings are
# regression-tested with Pillow 13; remove this override when upstream permits it.
override-dependencies = ["pillow>=13,<14"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
